title: Base theme
theme:
  tokens:
    color:
      primary: { value: '#0a6e4f', type: color, label: Main colour, contrast: text }
      text: '#222'
    font:
      heading: { value: sans, type: font, label: Headings }
    radius: { value: 4px, type: length, label: Rounding, min: 0, max: 20 }
    space: { value: normal, type: choice, label: Spacing, options: { normal: { label: Normal, value: 2rem }, wide: { label: Wide, value: 4rem } } }
  fonts:
    lora: { label: Lora, family: '"Lora", serif' }
  fields:
    brand: { type: headline, label: Name, maxLength: 40 }
    address: { type: text, label: Address, optional: true }
    links:
      type: list
      optional: true
      fields:
        text: { type: headline, label: Text }
  navigations:
    main: Main navigation
    footer: Footer
